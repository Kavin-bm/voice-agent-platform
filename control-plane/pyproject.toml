[project]
name = "voice-agent-control-plane"
version = "0.1.0"
description = "Control plane for the AI voice agent platform (owns tenants, agents, knowledge, policies, tools; drives Dograh as the voice runtime)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "cryptography>=43.0",
    "arq>=0.26",
    "httpx>=0.27",
    "minio>=7.2",
    "litellm>=1.52",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
